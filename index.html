<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#05060f" />
  <meta name="description" content="InfinRun — a 3-lane spaceship infinite runner. Swipe to dodge the asteroids." />

  <!-- Add-to-home-screen / fullscreen on mobile -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="InfinRun" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <title>InfinRun — Spaceship Runner</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js is loaded from a CDN at runtime via this import map.
       To remove the runtime dependency, drop three.module.js into
       vendor/ and point "three" at "./vendor/three.module.js". -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-score">
        <span class="hud-label">SOLVED</span>
        <span id="score">0</span>
      </div>
      <div class="hud-clock">
        <span class="hud-label">TIME</span>
        <span id="time">60</span>
      </div>
      <div class="hud-best">
        <span class="hud-label">BEST</span>
        <span id="best">0</span>
      </div>
    </div>

    <!-- Math HUD: the targets to reach and your running total -->
    <div id="mathbar" class="hidden">
      <span class="hud-label">TARGETS</span>
      <div id="targets"></div>
      <div id="expr">0</div>
    </div>

    <!-- Start screen -->
    <div id="start" class="overlay">
      <h1>INFIN<span>RUN</span></h1>
      <p class="tagline">race the clock</p>
      <button id="play-btn" class="btn">TAP TO LAUNCH</button>
      <p class="hint">
        Fly into moves like <b>+3</b>, <b>×4</b>, <b>/2</b> to land your total on
        <b>any</b> target. Each one buys <b>+15s</b>.<br />Swipe&nbsp;◀&nbsp;▶ or
        tap the screen sides; an <b>empty lane</b> skips.<br /><b>/</b> rounds down
        (7 / 2 = 3). Clock hits 0 — you're done.
      </p>
    </div>

    <!-- Game over screen -->
    <div id="gameover" class="overlay hidden">
      <h2>GAME OVER</h2>
      <div class="final">
        <div><span class="hud-label">SOLVED</span><strong id="final-score">0</strong></div>
        <div><span class="hud-label">BEST</span><strong id="final-best">0</strong></div>
      </div>
      <p id="new-best" class="new-best hidden">★ NEW BEST! ★</p>
      <button id="retry-btn" class="btn">PLAY AGAIN</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>

  <!-- Fallback: if the 3D engine fails to load (offline / CDN blocked),
       tell the player instead of leaving a dead button. -->
  <script>
    setTimeout(function () {
      if (!window.__INFINRUN_READY) {
        var hint = document.querySelector("#start .hint");
        if (hint) {
          hint.textContent =
            "Couldn't load the 3D engine — check your connection and reload.";
          hint.style.opacity = "0.9";
          hint.style.color = "#ff4d8d";
        }
      }
    }, 9000);
  </script>
</body>
</html>
